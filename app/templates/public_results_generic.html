<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ contest.title }} - Public Results</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<div class="container py-4">
  <h1 class="h3 mb-3">{{ contest.title }} - Ergebnisse</h1>
  <div class="row g-3">
    {% for image in top_10_images %}
    <div class="col-12 col-sm-6 col-md-4 col-lg-3">
      <div class="card bg-black border-secondary h-100">
        <img src="{{ url_for('main.media_year', year=year, filename=image.filename) }}" class="card-img-top" style="height:170px;object-fit:cover" alt="{{ image.uploader }}">
        <div class="card-body">
          <div class="small text-secondary">#{{ loop.index }}</div>
          <div class="fw-semibold">{{ image.uploader or 'Anonymous' }}</div>
          <div class="small">Score: {{ image.weighted_score or 0 }}</div>
          <div class="small">Stimmen: {{ image.vote_count or 0 }} | Punkte: {{ image.vote_points or 0 }}</div>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
</body>
</html>
