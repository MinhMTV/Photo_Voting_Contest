<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Archiv</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<div class="container py-4">
  <h1 class="h3 mb-3">Archiv</h1>
  <div class="list-group">
    {% for c in contests %}
    <div class="list-group-item bg-black text-light d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div>
        <div><strong>{{ contest_label(c) }}</strong>{% if c.id|string != contest_display_year(c) %} <span class="text-secondary">· ID {{ c.id }}</span>{% endif %}</div>
        <div class="small text-secondary">{{ c.start_at or '' }} - {{ c.end_at or '' }}</div>
      </div>
      <div class="d-flex gap-2">
        <a class="btn btn-sm btn-outline-info" href="{{ contest_public_url(c) }}">Live</a>
        <a class="btn btn-sm btn-outline-warning" href="{{ contest_results_url(c) }}">Ergebnisse</a>
        <a class="btn btn-sm btn-outline-secondary" href="{{ contest_waiting_url(c) }}">Waiting</a>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
</body>
</html>
