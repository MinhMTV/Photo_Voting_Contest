<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ contest.title }} - Casino Results</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{background:radial-gradient(circle at 50% -20%,#4d1b6e,#0c0914 60%);color:#ffeac0}.cardx{background:#171026;border:1px solid #7a5a2a;border-radius:14px;overflow:hidden}</style>
</head>
<body>
<div class="container py-4">
  <h1 class="h3 mb-3">🎰 {{ contest.title }} - Top 10</h1>
  <div class="row g-3">
    {% for image in top_10_images %}
    <div class="col-12 col-sm-6 col-md-4 col-lg-3">
      <div class="cardx h-100">
        <img src="{{ url_for('main.media_year', year=year, filename=image.filename) }}" style="width:100%;height:170px;object-fit:cover" alt="{{ image.uploader }}">
        <div class="p-2">
          <div class="small text-warning">#{{ loop.index }}</div>
          <div class="fw-semibold">{{ image.uploader or 'Anonymous' }}</div>
          <div class="small">Score: {{ image.weighted_score or 0 }}</div>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
</body>
</html>
