version: '3.8'

services:
  photo_contest:  # Ändere den Service-Namen von 'web' zu 'photo_contest'
    build: .
    container_name: photo_voting_app
    restart: unless-stopped
    ports:
      - "5050:5050"
    volumes:
      - ./instance:/app/instance
      - ./app/static:/app/app/static
      - ./backups:/app/backups
    environment:
      FLASK_APP: ${FLASK_APP:-run.py}
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_RUN_HOST: ${FLASK_RUN_HOST:-0.0.0.0}
      FLASK_RUN_PORT: ${FLASK_RUN_PORT:-5050}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      SECRET_KEY: ${SECRET_KEY:-dev123}
    networks:
      - wp_net  # <- hier hinzufügen

networks:
  wp_net:
    external: true
