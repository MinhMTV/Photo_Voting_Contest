version: '3.8'

services:
  photo_contest:  # Ändere den Service-Namen von 'web' zu 'photo_contest'
    build: .
    container_name: photo_voting_app
    restart: unless-stopped
    ports:
      - "5050:5050"
    volumes:
      - ./instance:/app/instance
      - ./app/static:/app/app/static
      - ./backups:/app/backups
    networks:
      - wp_net  # <- hier hinzufügen

networks:
  wp_net:
    external: true
